<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>АвтоМастер — Контакты</title>
    <meta
      name="description"
      content="Контакты автосервиса АвтоМастер в Москве. Наш адрес, телефон, время работы. Оставьте заявку на сайте и запишитесь на обслуживание в удобное для вас время без очередей."
    />
    <meta property="og:title" content="АвтоМастер — Контакты" />
    <meta
      property="og:description"
      content="Контакты автосервиса АвтоМастер в Москве. Наш адрес, телефон, время работы. Оставьте заявку на сайте и запишитесь на обслуживание в удобное для вас время без очередей."
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/main.js" defer></script>
  </head>
  <body class="font-sans">
    <header class="header bg-gray-900 px-6 py-4">
      <div
        class="header__container max-w-6xl mx-auto flex justify-between items-center"
      >
        <a href="index.html" class="header__logo text-white text-2xl font-bold">
          АвтоМастер
        </a>
        <button
          class="burger md:hidden text-white text-2xl"
          aria-label="Открыть меню навигации"
        >
          ☰
        </button>
        <nav
          class="nav hidden md:flex md:flex-row flex-col gap-4 absolute md:static top-16 left-0 w-full md:w-auto bg-gray-900 md:bg-transparent px-6 md:px-0 py-4 md:py-0"
          aria-label="Основная навигация"
        >
          <a href="index.html" class="nav__link text-white hover:text-red-400"
            >Главная</a
          >
          <a
            href="services.html"
            class="nav__link text-white hover:text-red-400"
            >Услуги</a
          >
          <a
            href="contacts.html"
            class="nav__link nav__link--active text-red-400"
            aria-current="page"
            >Контакты</a
          >
        </nav>
        <a
          href="contacts.html"
          class="header__cta bg-red-600 text-white px-4 py-2 rounded-md hidden md:block"
        >
          Записаться
        </a>
      </div>
    </header>

    <main class="main bg-gray-100 py-8 md:py-16">
      <section class="contacts">
        <div class="contacts__container max-w-6xl mx-auto px-6">
          <h1
            class="contacts-title text-3xl font-bold text-gray-900 mb-10 text-center"
          >
            Контакты
          </h1>
          <div class="contacts__items grid grid-cols-1 md:grid-cols-2 gap-12">
            <div class="contacts__info">
              <p class="contacts__text text-lg mb-4">
                📍 <strong>Адрес:</strong> г. Москва, ул. Большая Черкизовская,
                д. 24А, стр. 1
              </p>
              <p class="contacts__text text-lg mb-4">
                📞 <strong>Телефон:</strong>
                <a
                  href="tel:+74951234567"
                  class="contacts__link text-gray-800 hover:text-red-600"
                  >+7 (495) 123-45-67</a
                >
              </p>
              <p class="contacts__text text-lg mb-4">
                📧 <strong>Email:</strong>
                <a
                  href="mailto:info@autoservice.ru"
                  class="contacts__link text-gray-800 hover:text-red-600"
                  >info@autoservice.ru</a
                >
              </p>
              <p class="contacts__text text-lg mb-4">
                🕐 <strong>Время работы:</strong> Ежедневно с 09:00 до 21:00
              </p>
            </div>
            <div class="contacts__form">
              <h2 class="contacts__title text-2xl font-bold text-gray-900 mb-6">
                Записаться на обслуживание
              </h2>
              <form
                class="contacts__form-inner"
                action="https://formspree.io/f/xwvzjrqb"
                method="POST"
              >
                <label
                  for="name"
                  class="block text-sm font-medium text-gray-700 mb-1"
                >
                  Ваше имя
                </label>
                <input
                  type="text"
                  name="name"
                  placeholder="Ваше имя"
                  required
                  class="contacts__input border rounded p-3 w-full mb-4"
                  id="name"
                />
                <label
                  for="phone"
                  class="block text-sm font-medium text-gray-700 mb-1"
                >
                  Номер телефона
                </label>
                <input
                  type="tel"
                  name="phone"
                  placeholder="Номер телефона"
                  required
                  class="contacts__input border rounded p-3 w-full mb-4"
                  id="phone"
                />
                <label
                  for="car"
                  class="block text-sm font-medium text-gray-700 mb-1"
                >
                  Марка автомобиля
                </label>
                <input
                  type="text"
                  name="car"
                  placeholder="Марка автомобиля"
                  required
                  class="contacts__input border rounded p-3 w-full mb-4"
                  id="car"
                />
                <button
                  type="submit"
                  class="contacts__btn bg-red-600 text-white w-full py-3 rounded-md hover:bg-red-700 font-bold"
                >
                  Отправить заявку
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer bg-gray-900 text-white text-center py-4">
      <p class="footer__text">© 2026 АвтоМастер</p>
    </footer>
  </body>
</html>
